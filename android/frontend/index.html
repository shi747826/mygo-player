<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f5f2">
<meta name="referrer" content="no-referrer">
<title>MyGo Player</title>
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-discover" viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 1 0 0 17.6 8.8 8.8 0 0 0 0-17.6Z"/><path d="m14.9 9.1-1.6 4.2-4.2 1.6 1.6-4.2 4.2-1.6Z"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><path d="M6.5 4.5h11a1 1 0 0 1 1 1v14l-6.5-3.8-6.5 3.8v-14a1 1 0 0 1 1-1Z"/></symbol>
  <symbol id="i-me" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.2 20c.4-3.5 3.2-5.7 6.8-5.7s6.4 2.2 6.8 5.7"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4 4"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6.5h10M4 12h10M4 17.5h7"/><path d="m17 14.5 2.5 2.5L17 19.5"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.1S4.4 15.6 4.4 9.9A4.2 4.2 0 0 1 12 7.1a4.2 4.2 0 0 1 7.6 2.8c0 5.7-7.6 10.2-7.6 10.2Z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.3v13.4L19 12 8 5.3Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7.5 5.5h3v13h-3zM13.5 5.5h3v13h-3z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 5.5v13L9 12l9-6.5Z" fill="currentColor" stroke="none"/><path d="M6 5.5v13" stroke-width="2.2"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M6 5.5v13L15 12 6 5.5Z" fill="currentColor" stroke="none"/><path d="M18 5.5v13" stroke-width="2.2"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M19 8.2V4.5l-2 2A8 8 0 1 0 19.6 14"/><path d="M19 4.5h-4"/></symbol>
  <symbol id="i-source" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.7"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.7"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.7"/><path d="M16.8 13.8v6.4M13.6 16.9H20"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.7"/><path d="M12 10.7v5.2M12 7.7v.2"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5.5 7.5h13M9 7.5V5h6v2.5M7.2 7.5l.8 12h8l.8-12M10 11v5M14 11v5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5.5 12.5 4.2 4.2 8.8-9.4"/></symbol>
</svg>

<div id="app" class="app">
  <main id="mainScroll" class="main-scroll" tabindex="-1">
    <div id="view" class="view"></div>
  </main>

  <nav id="tabbar" class="tabbar" aria-label="主导航">
    <button type="button" class="tab is-active" data-tab="discover" aria-current="page">
      <svg class="icon" aria-hidden="true"><use href="#i-discover"/></svg><span>发现</span>
    </button>
    <button type="button" class="tab" data-tab="library">
      <svg class="icon" aria-hidden="true"><use href="#i-library"/></svg><span>追剧</span>
    </button>
    <button type="button" class="tab" data-tab="me">
      <svg class="icon" aria-hidden="true"><use href="#i-me"/></svg><span>我的</span>
    </button>
  </nav>
</div>

<section id="player" class="player controls-hidden" hidden role="dialog" aria-modal="true" aria-label="全屏播放">
  <div id="prevPreview" class="episode-preview preview-prev" aria-hidden="true">
    <span class="preview-kicker">上一集</span>
    <strong id="prevPreviewNumber" class="preview-number">—</strong>
    <span id="prevPreviewTitle" class="preview-title"></span>
  </div>
  <div id="nextPreview" class="episode-preview preview-next" aria-hidden="true">
    <span class="preview-kicker">下一集</span>
    <strong id="nextPreviewNumber" class="preview-number">—</strong>
    <span id="nextPreviewTitle" class="preview-title"></span>
  </div>

  <div id="playerStage" class="player-stage">
    <video id="video" playsinline webkit-playsinline preload="metadata"></video>
  </div>
  <div id="playerBackdrop" class="player-backdrop" aria-hidden="true"></div>
  <div class="player-scrim" aria-hidden="true"></div>

  <div id="mediaPlaceholder" class="media-placeholder" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p id="mediaMessage">正在准备播放</p>
    <div id="mediaErrorActions" class="media-error-actions" hidden>
      <button type="button" id="mediaRetry" class="button button-light">重试播放</button>
    </div>
  </div>

  <div id="playerGesture" class="player-gesture" aria-hidden="true"></div>

  <header class="player-header">
    <button type="button" id="playerBack" class="player-back" aria-label="返回">
      <svg class="icon" aria-hidden="true"><use href="#i-back"/></svg>
    </button>
    <div class="player-context">
      <span id="playerSource" class="player-source"></span>
      <span id="playerEpisodeTag" class="player-episode-tag"></span>
    </div>
  </header>

  <div id="episodeFlash" class="episode-flash" hidden aria-live="polite">
    <strong id="episodeFlashNumber"></strong>
    <span id="episodeFlashTitle"></span>
  </div>

  <div id="boostBadge" class="boost-badge" hidden role="status">
    <span class="boost-pulse" aria-hidden="true"></span>
    <strong>2×</strong><span>快进中</span>
  </div>

  <div id="pauseFlash" class="pause-flash" hidden aria-hidden="true">
    <svg class="icon"><use href="#i-play"/></svg>
  </div>

  <aside class="player-actions" aria-label="播放操作">
    <button type="button" id="playerFavorite" class="player-action" aria-label="收藏" aria-pressed="false">
      <span class="action-icon"><svg class="icon" aria-hidden="true"><use href="#i-heart"/></svg></span>
      <span id="favoriteLabel">追剧</span>
    </button>
  </aside>

  <div class="player-caption">
    <h1 id="playerTitle"></h1>
    <p id="playerEpisodeTitle" class="player-episode-title"></p>
    <p id="playerDescription" class="player-description"></p>
  </div>

  <div id="playerControls" class="player-controls">
    <div class="progress-panel">
      <div class="progress-meta">
        <span id="timeCurrent" class="time">0:00</span>
        <span id="timeDuration" class="time">0:00</span>
      </div>
      <div id="seekWrap" class="seek-wrap">
        <input id="seek" class="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="播放进度">
        <div id="seekBubble" class="seek-bubble" hidden>
          <strong id="seekBubbleTime">0:00</strong>
          <small id="seekBubbleTotal">/ 0:00</small>
        </div>
      </div>
    </div>
    <div class="player-bottom">
      <button type="button" id="openEpisodes" class="episode-pill">
        <svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>
        <span id="episodeOpenLabel">选集</span>
        <svg class="icon episode-pill-chevron" aria-hidden="true"><use href="#i-down"/></svg>
      </button>
      <span id="qualityBadge" class="quality-badge" hidden></span>
    </div>
  </div>

  <div id="playerDetailLoading" class="player-state" hidden>
    <div class="spinner"></div>
    <p>正在读取剧集</p>
  </div>
  <div id="playerDetailError" class="player-state player-state-error" hidden>
    <p id="playerDetailErrorText"></p>
    <button type="button" id="playerDetailRetry" class="button button-light">重新加载</button>
  </div>
</section>

<div id="overlay" class="overlay" hidden>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
    <div id="sheetGrip" class="sheet-grip" aria-hidden="true"></div>
    <header class="sheet-header">
      <div>
        <p id="sheetKicker" class="eyebrow"></p>
        <h2 id="sheetTitle"></h2>
      </div>
      <button type="button" id="sheetClose" class="round-button sheet-close" aria-label="关闭">
        <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </header>
    <div id="sheetBody" class="sheet-body"></div>
  </section>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="vendor/hls.min.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
